name: cubes-frontend regtest e2e (wallet matrix)

# Real-user-flow proof that inscribing a cube via each supported
# wallet produces an ord-indexed HTML inscription.
#
# Not a smoke test — every job spins up:
#   - bitcoind + electrs + ord (docker compose regtest stack)
#   - the actual cubes-frontend UI (via `ng serve -c regtest`)
#   - the actual wallet .crx unpacked into a headed Chromium under
#     xvfb, driven by Playwright to click Connect → sign popup →
#     Mint → sign popup → success alert
#   - a byte-for-byte comparison of the ord-indexed inscription
#     content against the HTML the on-page preview iframe rendered.
#
# Runs ONLY in CI. The wallet .crx binaries are hosted as release
# assets on ordpool-space/ordpool-sdk (public repo); per workspace
# policy we still don't execute unverified extension binaries on
# dev machines.
#
# No extra secrets needed — both source repos (ordpool-sdk for the
# .crx, cat21-ord for the ord source) are public, so the workflow's
# default GITHUB_TOKEN is enough to authenticate `gh release
# download` + `actions/checkout` against them.

on:
  push:
    branches: [main]
    paths:
      - 'apps/cubes-frontend/**'
      - '.github/workflows/e2e-cubes-regtest.yml'
      # Markdown cannot change an e2e result, and this workflow supersedes a
      # run in flight. A docs commit was cancelling a 14-lane matrix and
      # throwing away its evidence, which is expensive during an
      # investigation: the bottleneck there is samples, not wall clock.
      - '!apps/cubes-frontend/**/*.md'
  pull_request:
    paths:
      - 'apps/cubes-frontend/**'
      - '.github/workflows/e2e-cubes-regtest.yml'
      - '!apps/cubes-frontend/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# Cancel outdated runs on the same branch — no benefit to running
# stale wallet matrices to completion.
concurrency:
  group: cubes-regtest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cube-mint:
    # One job per wallet. Failure in one doesn't block others —
    # each wallet has independent selectors + independent SDK
    # connector code. `fail-fast: false` surfaces every wallet's
    # state on every push.
    strategy:
      fail-fast: false
      matrix:
        wallet:
          # Adding a wallet: create
          # `apps/cubes-frontend/e2e/regtest/specs/<name>-cube-mint-roundtrip.e2e.spec.ts`
          # + add it here + add a matching Cache/Download step in
          # the .crx block below.
          #
          # See ../WALLET-COMPATIBILITY.md for the coverage matrix +
          # per-wallet blockers (most non-Xverse connectors ignore
          # Network.Regtest, so their cubes-frontend spec is
          # blocked on an SDK derivation shim landing).
          - xverse
          - cat21wallet
          - leather
          - unisat
          - wizz
          - alby
          - okx
          # Not a wallet: the watch-only (xpub) mint path, which is the SECOND
          # way this app mints and needs no extension at all, because the
          # signature is made outside the browser by construction. The
          # extension cache and download steps below are each gated on a
          # wallet name, so none of them match and this job simply skips them.
          - watchonly
          # Not a wallet either: the funding-safety proof, which mints through
          # the watch-only path with a coin carrying an inscription, a cat, a
          # rune or a rare sat in the pool and asserts that coin is never spent.
          # Needs no extension, so the .crx steps below skip it the same way.
          - funding-safety
          # Not a wallet either: the disabled Mint button has to say WHY it is
          # disabled while the side-image probe runs. Holds the probe open to
          # make that window observable; needs no extension.
          - mint-cta
          # Not a wallet either: what the reader is told when the ONLY coin that
          # can fund the mint carries an asset. Watch-only uses one address for
          # everything, so this is the blocking case.
          - funding-warning
          # The notice half, on Leather, which hands out a separate payment
          # address. Needs the leather .crx, so it reuses that cache step below.
          - funding-notice
          # The third funding state: a coin that CAN fund and over-pays, because
          # its change is too small to keep. Watch-only, no extension needed.
          - funding-dust-band
          # Not a wallet: holds the cubes-index fetches so a suggestion's
          # arrival can be PLACED after the form is filled, and asserts typed
          # sides survive it. No extension, no wallet connect.
          - suggestion-repro
          # Not a wallet: the start page, /faq, the wildcard route and the
          # banner's route-driven visibility on the regtest build. Needs no
          # extension.
          - site-routes
          # Not a wallet: mints cubes through the SDK in its setup, indexes them
          # with the production indexer, and walks the detail page and the list
          # with the arrow keys. Needs no extension.
          - cube-navigation
          # Oyl removed 2026-08-06: vendor decommissioned the mainnet.ordit.io
          # relay-validator backend the extension calls during signPsbt
          # (DNS NXDOMAIN). The .crx still installs but every sign attempt
          # hangs indefinitely waiting for that backend. Re-add if Oyl
          # (or a successor) ships a new release that stands its own
          # infra back up.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Reuse the SDK's shipped regtest compose from node_modules instead of
    # a local copy. These env vars parametrize it for the cubes stack:
    # E2E_PREFIX keeps the container names the specs / helpers / bootstrap
    # expect (cubes-e2e-*); ELECTRS_SRC / CAT21_ORD_SRC point the build
    # contexts at this job's checkouts. Job-level so both the bring-up and
    # the teardown resolve the same container names.
    env:
      E2E_PREFIX: cubes-e2e
      ELECTRS_SRC: ${{ github.workspace }}/_ordpool-electrs
      CAT21_ORD_SRC: ${{ github.workspace }}/_cat21-ord
      # Build context for the real ordpool-backend (mempool-witness renderer)
      # that serves the just-minted cube before confirmation.
      ORDPOOL_SRC: ${{ github.workspace }}/_ordpool
      # The production cubes indexer, run against this lane's chain by
      # regtest-bootstrap.sh (build-cubes-index.sh).
      CUBES_INDEX_SRC: ${{ github.workspace }}/_ordinal-cubes-index
    defaults:
      run:
        working-directory: apps/cubes-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/cubes-frontend/package-lock.json

      # Scripts must run: ordpool-sdk builds its dist/ (ESM main entry) via
      # its `prepare` hook at install time; it is not checked in. This
      # matches build-cubes-frontend.yml (plain `npm ci`) and the workspace
      # .npmrc (`ignore-scripts=false`, the supply-chain posture is lockfile
      # discipline, not script-blocking).
      - run: npm ci

      # The source revisions this lane builds (our electrs, cat21-ord, Cat21
      # Wallet, the ordpool backend), from the SDK copy that matches
      # package-lock.json. Full shas, never branch names, so the lane builds
      # exactly what the pinned SDK was proven with.
      - name: Read the SDK's build pins
        run: grep -E '^[A-Z0-9_]+=' node_modules/ordpool-sdk/e2e/build-pins.env >> "$GITHUB_ENV"

      # Anonymous fetch of one commit by sha: the job token is scoped to this
      # repo, and both forks are public. cat21-ord is the build context for
      # cat21-ord and ord-stock (the compose file inlines the Dockerfile).
      - name: Check out cat21-ord at the pinned sha
        working-directory: ${{ github.workspace }}
        run: |
          git init -q _cat21-ord
          git -C _cat21-ord fetch -q --depth 1 https://github.com/ordpool-space/cat21-ord "$CAT21_ORD_SHA"
          git -C _cat21-ord checkout -q FETCH_HEAD

      # OUR electrs. docker-compose.regtest.yml builds the electrs service
      # from the ordpool-electrs fork (not the upstream mempool/electrs image);
      # ELECTRS_SRC points its build context at this checkout.
      - name: Check out ordpool-electrs at the pinned sha
        working-directory: ${{ github.workspace }}
        run: |
          git init -q _ordpool-electrs
          git -C _ordpool-electrs fetch -q --depth 1 https://github.com/ordpool-space/ordpool-electrs "$ORDPOOL_ELECTRS_SHA"
          git -C _ordpool-electrs checkout -q FETCH_HEAD

      # OUR backend, built for the ordpool-backend service (mempool-witness
      # renderer): its build context is _ordpool/backend + _ordpool/rust.
      # Same anonymous fetch of one pinned commit as the forks above.
      - name: Check out ordpool at the pinned sha
        working-directory: ${{ github.workspace }}
        run: |
          git init -q _ordpool
          git -C _ordpool fetch -q --depth 1 https://github.com/ordpool-space/ordpool "$ORDPOOL_SHA"
          git -C _ordpool checkout -q FETCH_HEAD

      # The production cubes indexer (grind.mjs, rarity.mjs) at the sha this
      # repo pins in cubes-index.env. build-cubes-index.sh extracts exactly that
      # commit, so fetching the one object is enough. Public repo, anonymous.
      - name: Fetch ordinal-cubes-index at the pinned sha
        working-directory: ${{ github.workspace }}
        run: |
          . apps/cubes-frontend/e2e/regtest/cubes-index.env
          git init -q _ordinal-cubes-index
          git -C _ordinal-cubes-index fetch -q --depth 1 https://github.com/ordpool-space/ordinal-cubes-index "$ORDINAL_CUBES_INDEX_SHA"

      # The same comparison the SDK's bootstraps make: a checkout at another
      # revision fails here, before anything is built from it.
      - name: Verify the checkouts against the build pins
        run: |
          . node_modules/ordpool-sdk/e2e/build-pins.sh
          check_build_pin ordpool-electrs "$ELECTRS_SRC" "$ORDPOOL_ELECTRS_SHA"
          check_build_pin cat21-ord "$CAT21_ORD_SRC" "$CAT21_ORD_SHA"
          check_build_pin ordpool "$ORDPOOL_SRC" "$ORDPOOL_SHA"

      # buildx gha cache: reuse the compiled electrs + cat21-ord images
      # across runs instead of recompiling Rust every run. A docker-container
      # builder + the Actions runtime env make type=gha work; the
      # .dockerignore excludes each clone's volatile .git/ so the COPY layer
      # (and the compile beneath it) is stable and cache-hits. Absolute
      # $GITHUB_WORKSPACE paths: the job default working-directory is
      # apps/cubes-frontend, but the clones land at the workspace root.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Export GitHub Actions runtime for the gha cache backend
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Stabilise the build contexts for layer caching
        run: |
          printf '.git\ntarget\n' > "$GITHUB_WORKSPACE/_ordpool-electrs/.dockerignore"
          printf '.git\ntarget\n' > "$GITHUB_WORKSPACE/_cat21-ord/.dockerignore"
          # ordpool-backend build context: keep host node_modules/dist/.git out
          # of the COPY layer so the image's own npm install + build are stable.
          printf '.git\nnode_modules\ndist\npackage\n' > "$GITHUB_WORKSPACE/_ordpool/backend/.dockerignore"
          printf '.git\ntarget\n' > "$GITHUB_WORKSPACE/_ordpool/rust/.dockerignore"
          # The backend Dockerfile's runtime stage does COPY /build/GeoIP, but
          # nothing in the build creates it (GeoIP = MaxMind geolocation, which
          # the /content + /preview witness routes never touch). Provide an
          # empty GeoIP dir in the docker/backend context so that COPY resolves.
          mkdir -p "$GITHUB_WORKSPACE/_ordpool/docker/backend/GeoIP"
          touch "$GITHUB_WORKSPACE/_ordpool/docker/backend/GeoIP/.gitkeep"

      - name: Install Playwright chromium + system deps
        run: ./node_modules/.bin/playwright install --with-deps chromium

      # Cache the unpacked wallet extension keyed by the version
      # pinned in playwright-bootstrap.sh. First run per version:
      # download + unzip (~5 s + GitHub API call). Subsequent
      # runs: cache hit, no PAT scope needed.
      - name: Cache Xverse extension
        if: matrix.wallet == 'xverse'
        id: xverse-cache
        uses: actions/cache@v4
        with:
          path: apps/cubes-frontend/e2e/regtest/extensions/xverse
          # Version tag lives in playwright-bootstrap.sh; keep in
          # sync manually — a bump there needs a bump here.
          key: xverse-extension-v2.3.2

      - name: Fetch Xverse .crx from ordpool-sdk release mirror
        # Not gated on cache-hit: the bootstrap re-reads the cached
        # manifest version and only re-downloads on a mismatch (else it
        # exits in <1s). So a VERSION bump in the script self-heals even if
        # the cache key below wasn't bumped — a stale key costs a re-fetch,
        # never a wrong build.
        if: matrix.wallet == 'xverse'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/regtest/playwright-bootstrap.sh xverse

      # CAT-21 wallet doesn't ship a published .crx yet (unlike
      # Xverse/Leather/Unisat/OKX/Phantom/Wizz/Alby which are
      # mirrored on ordpool-space/ordpool-sdk releases). Same pattern
      # as cat21-indexer/.github/workflows/e2e-regtest-mint-cat21wallet.yml:
      # checkout cat21-wallet source, pnpm build, then hand the
      # unpacked dist to playwright-bootstrap.sh via the
      # CAT21_WALLET_LOCAL_DIST env-var branch (the bootstrap script
      # already supports this at line 97).
      - name: Checkout cat21-wallet (extension source)
        if: matrix.wallet == 'cat21wallet'
        working-directory: ${{ github.workspace }}
        run: |
          git init -q _cat21-wallet-src
          git -C _cat21-wallet-src fetch -q --depth 1 https://github.com/ordpool-space/cat21-wallet "$CAT21_WALLET_SHA"
          git -C _cat21-wallet-src checkout -q FETCH_HEAD
          . "$GITHUB_WORKSPACE/apps/cubes-frontend/node_modules/ordpool-sdk/e2e/build-pins.sh"
          check_build_pin cat21-wallet _cat21-wallet-src "$CAT21_WALLET_SHA"

      - name: Setup pnpm for cat21-wallet build
        if: matrix.wallet == 'cat21wallet'
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Cache cat21-wallet pnpm store
        if: matrix.wallet == 'cat21wallet'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: cubes-cat21wallet-pnpm-${{ hashFiles('_cat21-wallet-src/pnpm-lock.yaml') }}
          restore-keys: |
            cubes-cat21wallet-pnpm-

      - name: Cache cat21-wallet extension dist
        if: matrix.wallet == 'cat21wallet'
        id: cat21wallet-dist-cache
        uses: actions/cache@v4
        with:
          path: _cat21-wallet-src/apps/extension/dist
          # One build per pinned wallet revision.
          key: cubes-cat21wallet-dist-${{ env.CAT21_WALLET_SHA }}

      - name: Install cat21-wallet dependencies
        if: matrix.wallet == 'cat21wallet' && steps.cat21wallet-dist-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/_cat21-wallet-src
        run: pnpm install --frozen-lockfile

      - name: Build cat21-wallet extension
        if: matrix.wallet == 'cat21wallet' && steps.cat21wallet-dist-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/_cat21-wallet-src
        run: pnpm build:extension

      - name: Stage cat21-wallet extension via LOCAL_DIST bootstrap
        if: matrix.wallet == 'cat21wallet'
        env:
          CAT21_WALLET_LOCAL_DIST: ${{ github.workspace }}/_cat21-wallet-src/apps/extension/dist
        run: bash e2e/regtest/playwright-bootstrap.sh cat21wallet

      - name: Cache Leather extension
        # funding-notice drives Leather too: it is the only wallet here that
        # hands out a SEPARATE payment address, which is what makes the notice
        # path reachable at all.
        if: matrix.wallet == 'leather' || matrix.wallet == 'funding-notice'
        id: leather-cache
        uses: actions/cache@v4
        with:
          path: apps/cubes-frontend/e2e/regtest/extensions/leather
          # Version tag lives in playwright-bootstrap.sh; keep in sync
          # manually — a bump there needs a bump here.
          key: leather-extension-v6.102.0

      - name: Fetch Leather .crx from ordpool-sdk release mirror
        if: matrix.wallet == 'leather' || matrix.wallet == 'funding-notice'   # not cache-gated: bootstrap self-heals on version mismatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/regtest/playwright-bootstrap.sh leather

      - name: Cache Unisat extension
        if: matrix.wallet == 'unisat'
        id: unisat-cache
        uses: actions/cache@v4
        with:
          path: apps/cubes-frontend/e2e/regtest/extensions/unisat
          # Version tag lives in playwright-bootstrap.sh; keep in sync.
          key: unisat-extension-v1.7.15

      - name: Fetch Unisat .crx from ordpool-sdk release mirror
        if: matrix.wallet == 'unisat'   # not cache-gated: bootstrap self-heals on version mismatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/regtest/playwright-bootstrap.sh unisat

      - name: Cache Wizz extension
        if: matrix.wallet == 'wizz'
        id: wizz-cache
        uses: actions/cache@v4
        with:
          path: apps/cubes-frontend/e2e/regtest/extensions/wizz
          # Version tag lives in playwright-bootstrap.sh; keep in sync.
          key: wizz-extension-v2.13.4

      - name: Fetch Wizz .crx from ordpool-sdk release mirror
        if: matrix.wallet == 'wizz'   # not cache-gated: bootstrap self-heals on version mismatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/regtest/playwright-bootstrap.sh wizz

      - name: Cache OKX extension
        if: matrix.wallet == 'okx'
        id: okx-cache
        uses: actions/cache@v4
        with:
          path: apps/cubes-frontend/e2e/regtest/extensions/okx
          # Version tag lives in playwright-bootstrap.sh; keep in sync.
          key: okx-extension-v4.1.0

      - name: Fetch OKX .crx from ordpool-sdk release mirror
        if: matrix.wallet == 'okx'   # not cache-gated: bootstrap self-heals on version mismatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/regtest/playwright-bootstrap.sh okx

      - name: Cache Alby extension
        if: matrix.wallet == 'alby'
        id: alby-cache
        uses: actions/cache@v4
        with:
          path: apps/cubes-frontend/e2e/regtest/extensions/alby
          # Version tag lives in playwright-bootstrap.sh; keep in sync.
          key: alby-extension-v3.14.2

      - name: Fetch Alby .crx from ordpool-sdk release mirror
        if: matrix.wallet == 'alby'   # not cache-gated: bootstrap self-heals on version mismatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/regtest/playwright-bootstrap.sh alby

      - name: Bring up bitcoind + electrs + ord-stock + cat21-ord + ordpool-backend
        # The funding-safety scan hits BOTH ord instances (same binary/image,
        # different runtime flags): ord-stock (--index-sats, no --index-cat21)
        # serves inscription content + the inscriptions/runes/rare-sats half of
        # the scan; cat21-ord (--index-cat21) serves the cats half. Both are
        # queried by the SDK UtxoContentScanner at mint time.
        env:
          COMPOSE_BAKE: "true"
        # Build electrs + the shared ord image via buildx bake against the SDK's
        # shipped compose + gha-cache overlay (from node_modules) so the overlay's
        # cache_from/to take effect; bake loads the image (it has an `image:` name)
        # for the following --no-build up. ord + ord-stock share ONE image, so the
        # build produces it once and both containers start from it. The
        # E2E_PREFIX / ELECTRS_SRC / CAT21_ORD_SRC env is set job-level.
        run: |
          docker compose -f node_modules/ordpool-sdk/e2e/docker-compose.regtest.yml -f node_modules/ordpool-sdk/e2e/docker-compose.gha-cache.yml --profile ord-stock --profile cat21-ord --profile ordpool-backend build electrs ord-stock ord ordpool-backend
          docker compose -f node_modules/ordpool-sdk/e2e/docker-compose.regtest.yml --profile ord-stock --profile cat21-ord --profile ordpool-backend up -d --no-build bitcoind electrs ord-stock ord ordpool-backend

      - name: Mine 101 blocks + create funding wallet
        env:
          REGTEST_ELECTRS_URL: http://localhost:3010
        run: bash e2e/regtest/regtest-bootstrap.sh > /tmp/regtest-bootstrap.json

      - name: Wait for electrs to sync tip
        run: |
          for i in {1..60}; do
            tip=$(curl -fsS http://localhost:3010/blocks/tip/height 2>/dev/null || echo 0)
            if [ "$tip" -ge "101" ]; then
              echo "electrs at height $tip"
              exit 0
            fi
            sleep 1
          done
          echo "electrs did not reach height 101 within 60s" >&2
          exit 1

      - name: Wait for ord-stock /status
        run: |
          for i in {1..180}; do
            if curl -fsS http://localhost:8081/status >/dev/null 2>&1; then
              echo "ord-stock ready"
              exit 0
            fi
            sleep 1
          done
          echo "ord-stock /status did not respond within 180s" >&2
          exit 1

      - name: Wait for cat21-ord /status
        run: |
          for i in {1..180}; do
            if curl -fsS http://localhost:8080/status >/dev/null 2>&1; then
              echo "cat21-ord ready"
              exit 0
            fi
            sleep 1
          done
          echo "cat21-ord /status did not respond within 180s" >&2
          exit 1

      - name: Run ${{ matrix.wallet }} cube-mint roundtrip under xvfb
        # Playwright wants a real X server for headed Chromium.
        # xvfb-run supplies a virtual one.
        env:
          ORDPOOL_E2E_NET_LOG_DIR: ${{ github.workspace }}/net-log
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            npm run e2e:regtest -- --grep "${{ matrix.wallet }}"

      # Every browser the specs launch writes Chrome's net log; this fails on
      # any connection, datagram or DNS lookup that left the machine. Runs on
      # a failed spec run too: what reached the network belongs in the report.
      - name: Check the net logs for traffic that left the machine
        if: success() || failure()
        run: node node_modules/ordpool-sdk/scripts/check-net-log.mjs "$GITHUB_WORKSPACE/net-log"

      - name: Upload the net logs
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.wallet }}-net-log
          path: net-log/
          retention-days: 7

      - name: Dump docker logs on failure
        if: failure()
        run: |
          # `|| true` on each: under bash -eo pipefail a failed `docker logs`
          # (e.g. a container that never started) would abort the step and
          # hide the later dumps — exactly when you need all of them.
          echo "=== bitcoind ==="; docker logs cubes-e2e-bitcoind 2>&1 | tail -100 || true
          echo "=== electrs ==="; docker logs cubes-e2e-electrs 2>&1 | tail -100 || true
          echo "=== ord-stock ==="; docker logs cubes-e2e-ord-stock 2>&1 | tail -100 || true
          echo "=== cat21-ord ==="; docker logs cubes-e2e-cat21-ord 2>&1 | tail -100 || true

      - name: Upload Playwright artifacts
        # Only upload on failure, and only keep for 1 day. Success
        # artifacts have no post-mortem value; failure artifacts
        # usually only need to live long enough for the next
        # iteration.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.wallet }}-playwright-results
          path: |
            apps/cubes-frontend/test-results-regtest/
            apps/cubes-frontend/playwright-report-regtest/
          retention-days: 1

      - name: Tear down regtest stack
        if: always()
        run: docker compose -f node_modules/ordpool-sdk/e2e/docker-compose.regtest.yml down -v
