    <!--
      Warm the browser cache for the two cube-scene scripts every cube
      iframe fetches. srcdoc iframes carry `<base href=ordinals.com>`
      (see `withDarkColorScheme`) so their relative /content/* URLs
      resolve directly to ordinals.com; matching preloads target the
      same origin so the cache-lookup hits.
      - renderer: referenced by every generated cube (cube-html.ts)
      - helper: fetched by the renderer at runtime
    -->
    <link rel="preload" as="script" crossorigin="anonymous"
      href="https://ordinals.com/content/fed0eb2d943b1b6ce83c1d7bfb4639d3d44c7fdb161b1037c2fadaf630e55a55i0">
    <link rel="preload" as="fetch" crossorigin="anonymous"
      href="https://ordinals.com/content/2dbdf9ebbec6be793fd16ae9b797c7cf968ab2427166aaf390b90b71778266abi0">

  </head>
