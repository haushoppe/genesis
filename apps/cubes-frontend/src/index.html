    <!--
      Warm the browser cache for the cube-renderer script every cube
      iframe fetches via the on-chain HTML's `<script src=/content/…>`.
      Same-origin (Cloudflare Pages `_redirects` proxies /content/*
      to ordinalsbot), so srcdoc iframes hit the shared HTTP cache and
      skip the fetch that would otherwise leave the canvas dark-but-
      empty between iframe load and the WebGL scene painting. The
      renderer id is frozen — every cube generated by `cube-html.ts`
      references this exact inscription.
    -->
    <link rel="preload" as="script"
      href="/content/fed0eb2d943b1b6ce83c1d7bfb4639d3d44c7fdb161b1037c2fadaf630e55a55i0">
