name: cubes-frontend regtest e2e (wallet matrix)

# Real-user-flow proof that inscribing a cube via each supported
# wallet produces an ord-indexed HTML inscription.
#
# Not a smoke test — every job spins up:
#   - bitcoind + electrs + ord (docker compose regtest stack)
#   - the actual cubes-frontend UI (via `ng serve -c regtest`)
#   - the actual wallet .crx unpacked into a headed Chromium under
#     xvfb, driven by Playwright to click Connect → sign popup →
#     Mint → sign popup → success alert
#   - a byte-for-byte comparison of the ord-indexed inscription
#     content against the HTML the on-page preview iframe rendered.
#
# Runs ONLY in CI. The wallet .crx binaries are hosted as release
# assets on ordpool-space/ordpool-sdk (public repo); per workspace
# policy we still don't execute unverified extension binaries on
# dev machines.
#
# No extra secrets needed — both source repos (ordpool-sdk for the
# .crx, cat21-ord for the ord source) are public, so the workflow's
# default GITHUB_TOKEN is enough to authenticate `gh release
# download` + `actions/checkout` against them.

on:
  push:
    branches: [main]
    paths:
      - 'apps/cubes-frontend/**'
      - '.github/workflows/e2e-cubes-regtest.yml'
  pull_request:
    paths:
      - 'apps/cubes-frontend/**'
      - '.github/workflows/e2e-cubes-regtest.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cancel outdated runs on the same branch — no benefit to running
# stale wallet matrices to completion.
concurrency:
  group: cubes-regtest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cube-mint:
    # One job per wallet. Failure in one doesn't block others —
    # each wallet has independent selectors + independent SDK
    # connector code. `fail-fast: false` surfaces every wallet's
    # state on every push.
    strategy:
      fail-fast: false
      matrix:
        wallet:
          # Adding a wallet: create
          # `apps/cubes-frontend/e2e/regtest/specs/<name>-cube-mint-roundtrip.spec.ts`
          # + add it here + add a matching Cache/Download step in
          # the .crx block below.
          #
          # See ../WALLET-COMPATIBILITY.md for the coverage matrix +
          # per-wallet blockers (most non-Xverse connectors ignore
          # Network.Regtest, so their cubes-frontend spec is
          # blocked on an SDK derivation shim landing).
          - xverse
          - cat21wallet
          - leather
          - unisat
          - wizz
          - alby
          - okx
          # Oyl removed 2026-08-06: vendor decommissioned the mainnet.ordit.io
          # relay-validator backend the extension calls during signPsbt
          # (DNS NXDOMAIN). The .crx still installs but every sign attempt
          # hangs indefinitely waiting for that backend. Re-add if Oyl
          # (or a successor) ships a new release that stands its own
          # infra back up.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Reuse the SDK's shipped regtest compose from node_modules instead of
    # a local copy. These env vars parametrize it for the cubes stack:
    # E2E_PREFIX keeps the container names the specs / helpers / bootstrap
    # expect (cubes-e2e-*); ELECTRS_SRC / CAT21_ORD_SRC point the build
    # contexts at this job's checkouts. Job-level so both the bring-up and
    # the teardown resolve the same container names.
    env:
      E2E_PREFIX: cubes-e2e
      ELECTRS_SRC: ${{ github.workspace }}/_ordpool-electrs
      CAT21_ORD_SRC: ${{ github.workspace }}/_cat21-ord
    defaults:
      run:
        working-directory: apps/cubes-frontend

    steps:
      - uses: actions/checkout@v4

      # cat21-ord source is needed as the build context for ord-stock
      # (the docker-compose file inlines the Dockerfile; the checkout
      # supplies the Rust source tree). Public repo, so anonymous
      # `git clone` works — actions/checkout with the workflow's
      # GITHUB_TOKEN fails on cross-repo access even for public
      # repos, because the token is scoped to haushoppe/genesis only.
      - name: Clone cat21-ord for the ord-stock image build
        # cat21-ord's default branch is `index-cat21` (force-pushed
        # squashed history per its HARD RULE), not `main`.
        # Override the job-level working-directory so the clone lands
        # at $GITHUB_WORKSPACE/_cat21-ord (where the docker step's
        # CAT21_ORD_SRC env var points), not
        # $GITHUB_WORKSPACE/apps/cubes-frontend/_cat21-ord.
        working-directory: ${{ github.workspace }}
        run: git clone --depth 1 --branch index-cat21 https://github.com/ordpool-space/cat21-ord _cat21-ord

      # OUR electrs. docker-compose.regtest.yml builds the electrs service
      # from the ordpool-electrs fork (not the upstream mempool/electrs
      # image); ELECTRS_SRC points its build context at this checkout.
      # Same anonymous-clone reasoning as cat21-ord above (the job token
      # can't reach a sibling org repo). Branch is `ordpool`.
      - name: Clone ordpool-electrs for the electrs image build
        working-directory: ${{ github.workspace }}
        run: git clone --depth 1 --branch ordpool https://github.com/ordpool-space/ordpool-electrs _ordpool-electrs

      # buildx gha cache: reuse the compiled electrs + cat21-ord images
      # across runs instead of recompiling Rust every run. A docker-container
      # builder + the Actions runtime env make type=gha work; the
      # .dockerignore excludes each clone's volatile .git/ so the COPY layer
      # (and the compile beneath it) is stable and cache-hits. Absolute
      # $GITHUB_WORKSPACE paths: the job default working-directory is
      # apps/cubes-frontend, but the clones land at the workspace root.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Export GitHub Actions runtime for the gha cache backend
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Stabilise the build contexts for layer caching
        run: |
          printf '.git\ntarget\n' > "$GITHUB_WORKSPACE/_ordpool-electrs/.dockerignore"
          printf '.git\ntarget\n' > "$GITHUB_WORKSPACE/_cat21-ord/.dockerignore"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/cubes-frontend/package-lock.json

      # The workspace CLAUDE.md pins `ignore-scripts=true` locally
      # to mitigate Shai-Hulud-style supply-chain worms. On CI
      # ephemeral runners the argument is weaker, but we keep the
      # posture consistent: install with --ignore-scripts and then
      # manually build the one dep that needs it (ordpool-sdk's
      # ng-packagr dist is pre-built + checked in, so its npm
      # install actually needs no build step).
      - run: npm ci --ignore-scripts

      - name: Install Playwright chromium + system deps
        run: ./node_modules/.bin/playwright install --with-deps chromium

      # Cache the unpacked wallet extension keyed by the version
      # pinned in playwright-bootstrap.sh. First run per version:
      # download + unzip (~5 s + GitHub API call). Subsequent
      # runs: cache hit, no PAT scope needed.
      - name: Cache Xverse extension
        if: matrix.wallet == 'xverse'
        id: xverse-cache
        uses: actions/cache@v4
        with:
          path: apps/cubes-frontend/e2e/regtest/extensions/xverse
          # Version tag lives in playwright-bootstrap.sh; keep in
          # sync manually — a bump there needs a bump here.
          key: xverse-extension-v2.3.2

      - name: Fetch Xverse .crx from ordpool-sdk release mirror
        if: matrix.wallet == 'xverse' && steps.xverse-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/regtest/playwright-bootstrap.sh xverse

      # CAT-21 wallet doesn't ship a published .crx yet (unlike
      # Xverse/Leather/Unisat/OKX/Phantom/Wizz/Alby which are
      # mirrored on ordpool-space/ordpool-sdk releases). Same pattern
      # as cat21-indexer/.github/workflows/e2e-regtest-mint-cat21wallet.yml:
      # checkout cat21-wallet source, pnpm build, then hand the
      # unpacked dist to playwright-bootstrap.sh via the
      # CAT21_WALLET_LOCAL_DIST env-var branch (the bootstrap script
      # already supports this at line 97).
      - name: Checkout cat21-wallet (extension source)
        if: matrix.wallet == 'cat21wallet'
        working-directory: ${{ github.workspace }}
        run: git clone --depth 1 --branch main https://github.com/ordpool-space/cat21-wallet _cat21-wallet-src

      - name: Setup pnpm for cat21-wallet build
        if: matrix.wallet == 'cat21wallet'
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Cache cat21-wallet pnpm store
        if: matrix.wallet == 'cat21wallet'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: cubes-cat21wallet-pnpm-${{ hashFiles('_cat21-wallet-src/pnpm-lock.yaml') }}
          restore-keys: |
            cubes-cat21wallet-pnpm-

      - name: Cache cat21-wallet extension dist
        if: matrix.wallet == 'cat21wallet'
        id: cat21wallet-dist-cache
        uses: actions/cache@v4
        with:
          path: _cat21-wallet-src/apps/extension/dist
          # Rebuild only when wallet source changes. Keys off the
          # source files themselves so a wallet-repo push invalidates
          # the cache automatically.
          key: cubes-cat21wallet-dist-${{ hashFiles('_cat21-wallet-src/pnpm-lock.yaml', '_cat21-wallet-src/apps/extension/**/*.ts', '_cat21-wallet-src/apps/extension/**/*.tsx', '_cat21-wallet-src/packages/**/*.ts') }}

      - name: Install cat21-wallet dependencies
        if: matrix.wallet == 'cat21wallet' && steps.cat21wallet-dist-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/_cat21-wallet-src
        run: pnpm install --frozen-lockfile

      - name: Build cat21-wallet extension
        if: matrix.wallet == 'cat21wallet' && steps.cat21wallet-dist-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/_cat21-wallet-src
        run: pnpm build:extension

      - name: Stage cat21-wallet extension via LOCAL_DIST bootstrap
        if: matrix.wallet == 'cat21wallet'
        env:
          CAT21_WALLET_LOCAL_DIST: ${{ github.workspace }}/_cat21-wallet-src/apps/extension/dist
        run: bash e2e/regtest/playwright-bootstrap.sh cat21wallet

      - name: Cache Leather extension
        if: matrix.wallet == 'leather'
        id: leather-cache
        uses: actions/cache@v4
        with:
          path: apps/cubes-frontend/e2e/regtest/extensions/leather
          # Version tag lives in playwright-bootstrap.sh; keep in sync
          # manually — a bump there needs a bump here.
          key: leather-extension-v6.102.0

      - name: Fetch Leather .crx from ordpool-sdk release mirror
        if: matrix.wallet == 'leather' && steps.leather-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/regtest/playwright-bootstrap.sh leather

      - name: Cache Unisat extension
        if: matrix.wallet == 'unisat'
        id: unisat-cache
        uses: actions/cache@v4
        with:
          path: apps/cubes-frontend/e2e/regtest/extensions/unisat
          # Version tag lives in playwright-bootstrap.sh; keep in sync.
          key: unisat-extension-v1.7.15

      - name: Fetch Unisat .crx from ordpool-sdk release mirror
        if: matrix.wallet == 'unisat' && steps.unisat-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/regtest/playwright-bootstrap.sh unisat

      - name: Cache Wizz extension
        if: matrix.wallet == 'wizz'
        id: wizz-cache
        uses: actions/cache@v4
        with:
          path: apps/cubes-frontend/e2e/regtest/extensions/wizz
          # Version tag lives in playwright-bootstrap.sh; keep in sync.
          key: wizz-extension-v2.13.4

      - name: Fetch Wizz .crx from ordpool-sdk release mirror
        if: matrix.wallet == 'wizz' && steps.wizz-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/regtest/playwright-bootstrap.sh wizz

      - name: Cache OKX extension
        if: matrix.wallet == 'okx'
        id: okx-cache
        uses: actions/cache@v4
        with:
          path: apps/cubes-frontend/e2e/regtest/extensions/okx
          # Version tag lives in playwright-bootstrap.sh; keep in sync.
          key: okx-extension-v4.1.0

      - name: Fetch OKX .crx from ordpool-sdk release mirror
        if: matrix.wallet == 'okx' && steps.okx-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/regtest/playwright-bootstrap.sh okx

      - name: Cache Alby extension
        if: matrix.wallet == 'alby'
        id: alby-cache
        uses: actions/cache@v4
        with:
          path: apps/cubes-frontend/e2e/regtest/extensions/alby
          # Version tag lives in playwright-bootstrap.sh; keep in sync.
          key: alby-extension-v3.14.2

      - name: Fetch Alby .crx from ordpool-sdk release mirror
        if: matrix.wallet == 'alby' && steps.alby-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/regtest/playwright-bootstrap.sh alby

      - name: Bring up bitcoind + electrs + ord-stock
        # cat21-ord isn't needed for cube inscribes (cubes are
        # regular HTML inscriptions, not CAT-21 cats — bounced off
        # ord-stock which uses the same mainline ord binary
        # without --index-cat21). Only bring up what we hit.
        env:
          COMPOSE_BAKE: "true"
        # Build electrs + ord-stock via buildx bake against the SDK's
        # shipped compose + gha-cache overlay (from node_modules) so the
        # overlay's cache_from/to take effect; bake loads the images (they
        # have an `image:` name) for the following --no-build up. The
        # E2E_PREFIX / ELECTRS_SRC / CAT21_ORD_SRC env is set job-level.
        run: |
          docker compose -f node_modules/ordpool-sdk/e2e/docker-compose.regtest.yml -f node_modules/ordpool-sdk/e2e/docker-compose.gha-cache.yml --profile ord-stock build electrs ord-stock
          docker compose -f node_modules/ordpool-sdk/e2e/docker-compose.regtest.yml --profile ord-stock up -d --no-build bitcoind electrs ord-stock

      - name: Mine 101 blocks + create funding wallet
        env:
          REGTEST_ELECTRS_URL: http://localhost:3000
        run: bash e2e/regtest/regtest-bootstrap.sh > /tmp/regtest-bootstrap.json

      - name: Wait for electrs to sync tip
        run: |
          for i in {1..60}; do
            tip=$(curl -fsS http://localhost:3000/blocks/tip/height 2>/dev/null || echo 0)
            if [ "$tip" -ge "101" ]; then
              echo "electrs at height $tip"
              exit 0
            fi
            sleep 1
          done
          echo "electrs did not reach height 101 within 60s" >&2
          exit 1

      - name: Wait for ord-stock /status
        run: |
          for i in {1..180}; do
            if curl -fsS http://localhost:8081/status >/dev/null 2>&1; then
              echo "ord-stock ready"
              exit 0
            fi
            sleep 1
          done
          echo "ord-stock /status did not respond within 180s" >&2
          exit 1

      - name: Run ${{ matrix.wallet }} cube-mint roundtrip under xvfb
        # Playwright wants a real X server for headed Chromium.
        # xvfb-run supplies a virtual one.
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            npm run e2e:regtest -- --grep "${{ matrix.wallet }}"

      - name: Dump docker logs on failure
        if: failure()
        run: |
          echo "=== bitcoind ==="; docker logs cubes-e2e-bitcoind 2>&1 | tail -100
          echo "=== electrs ==="; docker logs cubes-e2e-electrs 2>&1 | tail -100
          echo "=== ord-stock ==="; docker logs cubes-e2e-ord-stock 2>&1 | tail -100

      - name: Upload Playwright artifacts
        # Only upload on failure, and only keep for 1 day. Success
        # artifacts have no post-mortem value; failure artifacts
        # usually only need to live long enough for the next
        # iteration.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.wallet }}-playwright-results
          path: |
            apps/cubes-frontend/test-results-regtest/
            apps/cubes-frontend/playwright-report-regtest/
          retention-days: 1

      - name: Tear down regtest stack
        if: always()
        run: docker compose -f node_modules/ordpool-sdk/e2e/docker-compose.regtest.yml down -v
