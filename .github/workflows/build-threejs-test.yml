name: Build Three.js Test Cube

on:
  push:
    branches: [ main ]
    paths:
      - 'z_extra/prototypes/threejs-test/**'
      - '.github/workflows/build-threejs-test.yml'

# Harden installs against transient registry blips like ECONNRESET: retry more
# times over a longer backoff window than npm's default of 2. npm and pnpm both
# read these npm_config_* values.
env:
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"
  npm_config_fetch_timeout: "600000"

jobs:

  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./z_extra/prototypes/threejs-test

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 26

    - run: npm install --force
    - run: npm run build
    - name: Deploy Page to cube-threejs-test-build repo
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        npx angular-cli-ghpages --repo=https://github.com/haushoppe/cube-threejs-test-build.git --branch=main --name="The Buildbot" --email=noreply@haushoppe.art --no-notfound --no-nojekyll

