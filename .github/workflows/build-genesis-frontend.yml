name: Build Genesis Frontend

# Publishes `apps/genesis-frontend/placeholder/` to
# `haushoppe/genesis-frontend-build@main`, which Cloudflare Pages serves at
# genesis.haushoppe.art.
#
# genesis.haushoppe.art serves a static placeholder: a single HTML file and a
# logo, no scripts at all. The Angular ERC-721 app in `src/` is kept and is not
# built or shipped here, so none of its dependency graph reaches a visitor.
# Restoring it means restoring the install, license, test and build steps this
# job had (`git log -- .github/workflows/build-genesis-frontend.yml`) and
# pointing `--dir` back at `dist`.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'apps/genesis-frontend/**'
      - '.github/workflows/build-genesis-frontend.yml'

# Harden the deploy tool's own fetch against transient registry blips like
# ECONNRESET: retry more times over a longer backoff window than npm's default
# of 2. npx reads these npm_config_* values too.
env:
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"
  npm_config_fetch_timeout: "600000"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/genesis-frontend

    steps:
    - uses: actions/checkout@v4

    # `angular-cli-ghpages` force-pushes the directory as the whole branch, so
    # the app's previous bundles stop being served rather than lingering beside
    # the placeholder.
    - name: Deploy placeholder to haushoppe/genesis-frontend-build@main
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        npx angular-cli-ghpages \
          --repo=https://github.com/haushoppe/genesis-frontend-build.git \
          --branch=main \
          --dir=placeholder \
          --name="The Buildbot" \
          --email=noreply@haushoppe.art \
          --no-notfound \
          --no-nojekyll
