name: Build Genesis Frontend

# Builds the standalone Angular genesis-frontend (apps/genesis-frontend/) and
# pushes the dist/ artifact to `haushoppe/genesis-frontend-build@main`,
# which Cloudflare Pages auto-deploys to genesis.haushoppe.art.
#
# No more Nx — genesis-frontend has its own package.json with only the
# Angular + NgRx + web3-onboard + Kendo deps it needs.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'apps/genesis-frontend/**'
      - '.github/workflows/build-genesis-frontend.yml'

# Harden installs against transient registry blips like ECONNRESET: retry more
# times over a longer backoff window than npm's default of 2. npm and pnpm both
# read these npm_config_* values.
env:
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"
  npm_config_fetch_timeout: "600000"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/genesis-frontend

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 26
        cache: 'npm'
        cache-dependency-path: apps/genesis-frontend/package-lock.json

    - run: npm ci
    # Via npx: this inactive app's package-lock stays untouched rather than
    # regenerated to add a devDep. Reads apps/genesis-frontend/.jscpd.json.
    - name: Duplicate check (jscpd)
      run: npx --yes jscpd@4.3.0
    - run: npx kendo-ui-license activate
      env:
        KENDO_UI_LICENSE: ${{ secrets.KENDO_UI_LICENSE }}
    - run: npm test --if-present
    - run: npm run build

    - name: Deploy to haushoppe/genesis-frontend-build@main
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        npx angular-cli-ghpages \
          --repo=https://github.com/haushoppe/genesis-frontend-build.git \
          --branch=main \
          --dir=dist \
          --name="The Buildbot" \
          --email=noreply@haushoppe.art \
          --no-notfound \
          --no-nojekyll
