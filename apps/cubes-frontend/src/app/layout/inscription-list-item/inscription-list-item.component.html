@if (inscription(); as ins) {
  <a
    [routerLink]="['/inscription', ins.inscriptionId]"
    role="navigation"
    attr.aria-label="Details for Inscription {{ ins.inscriptionId }}"
  >
    <div class="iframe-container">
      <iframe
        class="responsive-iframe"
        appToggleIframe
        [toggleInscriptionId]="ins.inscriptionId"
        sandbox="allow-scripts"
      ></iframe>
    </div>
    <div class="one-line fs-6 lh-sm mt-2 ps-1" [class.pb-4]="!rarityLine()">
      {{ ins.meta.name }}
    </div>
    @if (rarityLine(); as line) {
      <div class="one-line small text-muted lh-sm ps-1" [class.pb-4]="!chromeCursed()" data-testid="cube-tile-rarity">{{ line }}</div>
    }
    @if (chromeCursed()) {
      <div class="one-line small lh-sm ps-1 pb-4 chrome-curse-tile" data-testid="cube-tile-chrome-curse">{{ chromeCurseLabel }}</div>
    }
  </a>
}
