name: Build Cubes Frontend

# Builds the standalone Angular cubes-frontend (apps/cubes-frontend/) and
# pushes the dist/ artifact to `haushoppe/cubes-frontend-build@main`,
# which Cloudflare Pages auto-deploys to cubes.haushoppe.art.
#
# No more Nx — cubes-frontend has its own package.json with only the
# Angular + NgRx + Bitcoin deps it needs.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'apps/cubes-frontend/**'
      - '.github/workflows/build-cubes-frontend.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cubes-frontend

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: apps/cubes-frontend/package-lock.json

    - run: npm ci
    # ng test (tsconfig.spec.json → *.spec.ts) and the vitest suite
    # (vitest.config.ts → *.vitest.ts) cover disjoint file sets, so CI runs
    # BOTH. Without the second line the nine *.vitest.ts specs never execute
    # in CI.
    - run: npm test --if-present
    - run: npm run test:vitest
    - name: Build (with HAUSHOPPE_TIP_ADDRESS injected)
      env:
        # Real mainnet P2TR address baked into the prod bundle at build
        # time by scripts/inject-env.mjs. Missing / malformed value fails
        # the build; the SPA's main.ts also refuses to boot if the
        # placeholder ever slips through.
        HAUSHOPPE_TIP_ADDRESS: ${{ secrets.HAUSHOPPE_TIP_ADDRESS }}
      run: npm run build

    - name: Deploy to haushoppe/cubes-frontend-build@main
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        npx angular-cli-ghpages \
          --repo=https://github.com/haushoppe/cubes-frontend-build.git \
          --branch=main \
          --dir=dist \
          --name="The Buildbot" \
          --email=noreply@haushoppe.art \
          --no-notfound \
          --no-nojekyll
